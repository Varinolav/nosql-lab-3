services:
  mongodb:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}) }; if (!db.hello().isWritablePrimary) quit(1)"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    env_file:
      - .env
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  scylla-1:
    image: scylladb/scylla:latest
    command: ["--smp", "1", "--memory", "2G", "--overprovisioned", "1", "--developer-mode", "1", "--reactor-backend", "epoll"]
    ports:
      - "127.0.0.1:9042:9042"
    volumes:
      - scylla-1-data:/var/lib/scylla
    healthcheck: &scylla-healthcheck
      test: ["CMD-SHELL", "cqlsh \"$$HOSTNAME\" 9042 -e \"SELECT release_version FROM system.local;\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  scylla-2:
    image: scylladb/scylla:latest
    command: ["--seeds", "scylla-1", "--smp", "1", "--memory", "2G", "--overprovisioned", "1", "--developer-mode", "1", "--reactor-backend", "epoll"]
    ports:
      - "127.0.0.1:9043:9042"
    volumes:
      - scylla-2-data:/var/lib/scylla
    depends_on:
      scylla-1:
        condition: service_started
    healthcheck: *scylla-healthcheck
    restart: unless-stopped

  scylla-3:
    image: scylladb/scylla:latest
    command: ["--seeds", "scylla-1", "--smp", "1", "--memory", "2G", "--overprovisioned", "1", "--developer-mode", "1", "--reactor-backend", "epoll"]
    ports:
      - "127.0.0.1:9044:9042"
    volumes:
      - scylla-3-data:/var/lib/scylla
    depends_on:
      scylla-2:
        condition: service_started
    healthcheck: *scylla-healthcheck
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_PORT: 8080
      MONGODB_URI: mongodb://mongodb:27017/lab_3?replicaSet=rs0&directConnection=true
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SCYLLA_CONTACT_POINTS: scylla-1:9042,scylla-2:9042,scylla-3:9042
      SCYLLA_LOCAL_DATACENTER: datacenter1
    ports:
      - "127.0.0.1:${APP_PORT}:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      scylla-1:
        condition: service_healthy
      scylla-2:
        condition: service_healthy
      scylla-3:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  mongodb-data:
  redis-data:
  scylla-1-data:
  scylla-2-data:
  scylla-3-data:
