spring.config.import=optional:file:.env[.properties]

spring.application.name=${SPRING_APPLICATION_NAME:lab-3}
server.port=${APP_PORT:8080}

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/lab_3?replicaSet=rs0&directConnection=true}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

spring.cassandra.contact-points=${SCYLLA_CONTACT_POINTS:localhost:9042,localhost:9043,localhost:9044}
spring.cassandra.local-datacenter=${SCYLLA_LOCAL_DATACENTER:datacenter1}
spring.cassandra.keyspace-name=lab_3
spring.cassandra.schema-action=none
